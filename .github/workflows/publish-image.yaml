name: Publish production image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: Publish immutable GHCR image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Check out tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git tag --points-at "$REVISION" --list | grep --extended-regexp '^v[0-9]+\.[0-9]+\.[0-9]+$')
          test "$(printf '%s\n' "$version" | wc -l)" -eq 1
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        env:
          REGISTRY: ghcr.io
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin

      - name: Build and push release image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx build --pull --label "org.opencontainers.image.revision=$REVISION" --file .docker/php/Dockerfile.prod --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$REVISION" --metadata-file "$RUNNER_TEMP/app-metadata.json" --push .
          digest=$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/app-metadata.json")
          printf 'image=%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest release image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Build and push GLiNER sidecar
        id: gliner
        env:
          IMAGE: ghcr.io/${{ github.repository }}-gliner
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx build --pull --platform linux/amd64 --build-arg "SOURCE_REVISION=$REVISION" --file .docker/gliner2/Dockerfile --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$REVISION" --metadata-file "$RUNNER_TEMP/gliner-metadata.json" --push .
          digest=$(jq -er '.["containerimage.digest"] | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/gliner-metadata.json")
          model_revision=$(sed -n 's/^ARG GLINER_REVISION=//p' .docker/gliner2/Dockerfile)
          [[ "$model_revision" =~ ^[0-9a-f]{40}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published `%s@%s` from `%s`, model revision `%s`\n' "$IMAGE" "$digest" "$REVISION" "$model_revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest GLiNER sidecar provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}-gliner
          subject-digest: ${{ steps.gliner.outputs.digest }}
          push-to-registry: true
