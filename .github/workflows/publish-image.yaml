name: Publish production image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish immutable GHCR image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git tag --points-at "$REVISION" --list 'v*' | head -n 1)
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        env:
          REGISTRY: ghcr.io
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin

      - name: Build and push release image
        id: image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --pull --file .docker/php/Dockerfile.prod --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$REVISION" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$REVISION"
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          printf 'image=%s@%s\n' "$IMAGE" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Published `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Request production rollout
        env:
          DEPLOYMENT_DISPATCH_TOKEN: ${{ secrets.DEPLOYMENT_DISPATCH_TOKEN }}
          IMAGE: ${{ steps.image.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$DEPLOYMENT_DISPATCH_TOKEN"

          payload=$(jq --null-input --compact-output \
            --arg image "$IMAGE" \
            --arg revision "$REVISION" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg tag "$VERSION" \
            '{event_type: "production-image-published", client_payload: {image: $image, revision: $revision, source_repository: $source_repository, tag: $tag}}')

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $DEPLOYMENT_DISPATCH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --data "$payload" \
            https://api.github.com/repos/curlysanders/job-application-tracker-deploy/dispatches
