name: Publish production image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish immutable GHCR image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v')

    steps:
      - name: Check out tested revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(git tag --points-at "$REVISION" --list 'v*' | head -n 1)
          test -n "$version"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        env:
          REGISTRY: ghcr.io
          USERNAME: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login "$REGISTRY" --username "$USERNAME" --password-stdin

      - name: Build and push release image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --pull --file .docker/php/Dockerfile.prod --tag "$IMAGE:$VERSION" --tag "$IMAGE:sha-$REVISION" .
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$REVISION"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' >> "$GITHUB_STEP_SUMMARY"
