deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*test.*#'
    layers:
        -
            name: UI
            collectors:
                -
                    type: directory
                    value: src/UI
        -
            name: Application
            collectors:
                -
                    type: directory
                    value: src/Application
        -
            name: Domain
            collectors:
                -
                    type: directory
                    value: src/Domain
        -
            name: Infrastructure
            collectors:
                -
                    type: directory
                    value: src/Infrastructure
        -
            name: Symfony
            collectors:
                -
                    type: classNameRegex
                    value: '#^Symfony\\#'
        -
            name: Doctrine
            collectors:
                -
                    type: classNameRegex
                    value: '#^Doctrine\\#'
        -
            name: Twig
            collectors:
                -
                    type: classNameRegex
                    value: '#^Twig\\#'
        -
            name: Psr
            collectors:
                -
                    type: classNameRegex
                    value: '#^Psr\\#'
        -
            name: League
            collectors:
                -
                    type: classNameRegex
                    value: '#^League\\#'
        -
            name: Brick
            collectors:
                -
                    type: classNameRegex
                    value: '#^Brick\\#'
        -
            name: PHP
            collectors:
                -
                    type: php_internal
                    value: '.*'
    ruleset:
        UI:
            - Application
            - Domain
            - Symfony
            - Twig
            - League
            - PHP
        Application:
            - Domain
            - Psr
            - PHP
        Domain:
            - Symfony
            - Doctrine
            - Brick
            - PHP
        Infrastructure:
            - Application
            - Domain
            - Symfony
            - Doctrine
            - Psr
            - League
            - PHP
