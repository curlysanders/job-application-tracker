deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*test.*#'
    layers:
        -
            name: UI
            collectors:
                -
                    type: directory
                    value: src/UI
        -
            name: Application
            collectors:
                -
                    type: directory
                    value: src/Application
        -
            name: Domain
            collectors:
                -
                    type: directory
                    value: src/Domain
        -
            name: Infrastructure
            collectors:
                -
                    type: directory
                    value: src/Infrastructure
    ruleset:
        UI:
            - Application
            - Domain
        Application:
            - Domain
        Domain: ~
        Infrastructure:
            - Application
            - Domain
