services:
  app:
    image: job-application-tracker-app
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    container_name: job_application_tracker_app
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # A hostname enables Caddy's automatic HTTPS; use FRANKENPHP_SERVER_NAME=:80 for HTTP only.
      SERVER_NAME: ${FRANKENPHP_SERVER_NAME:-${SERVER_NAME:-localhost}}
      FRANKENPHP_CONFIG: "worker /app/public/index.php 2"
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
      XDEBUG_MODE: ${XDEBUG_MODE:-debug}
      APP_REQUEST_TIMING: ${APP_REQUEST_TIMING:-0}
      PHP_IDE_CONFIG: serverName=job-application-tracker
    extra_hosts:
      - host.docker.internal:host-gateway
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - .:/app
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      db:
        condition: service_healthy
      caddy-volume-init:
        condition: service_completed_successfully

  worker:
    image: job-application-tracker-app
    restart: unless-stopped
    command: ["php", "bin/console", "messenger:consume", "outbox", "--time-limit=3600", "--memory-limit=128M"]
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_DEBUG: ${APP_DEBUG:-1}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'messenger:consume' /proc/1/cmdline && grep -aq 'outbox' /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  benchmark:
    image: job-application-tracker-app
    profiles: ["benchmark"]
    restart: "no"
    command: ["sh", "-c", "php bin/console cache:warmup && exec frankenphp run --config /etc/frankenphp/Caddyfile"]
    env_file:
      - .env.local
    environment:
      SERVER_NAME: ":80"
      FRANKENPHP_CONFIG: "worker /app/public/index.php 2"
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_REQUEST_TIMING: "1"
      XDEBUG_MODE: "off"
    ports:
      - "127.0.0.1:18081:80"
    volumes:
      - .:/app:ro
    tmpfs:
      - /app/var/cache:mode=1777
      - /app/var/log:mode=1777
      - /data:mode=1777
      - /config:mode=1777
    depends_on:
      db:
        condition: service_healthy

  caddy-volume-init:
    image: job-application-tracker-app
    user: "0:0"
    restart: "no"
    command: ["sh", "-c", "chown -R 1000:1000 /data /config"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  db:
    image: mariadb:13.0.2@sha256:f1bba652ba57bea3099ca2fe1af692af537c27d96e0bcde39dce29e2ba1ec4f3
    container_name: job_application_tracker_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: job_application_tracker
      MYSQL_USER: job_application_tracker
      MYSQL_PASSWORD: password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - database_data:/var/lib/mysql:rw
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  database_data:
