# Development-only worker reloads. Docker Compose loads this file automatically.
services:
  app:
    environment:
      # Keep debugger support and PhpStorm coverage available during local development.
      XDEBUG_MODE: ${XDEBUG_MODE:-debug,coverage}
      FRANKENPHP_CONFIG: |
        worker {
          file /app/public/index.php
          num 2
          watch /app/src
          watch /app/config
          watch /app/templates
          watch /app/assets
          watch /app/public
        }
